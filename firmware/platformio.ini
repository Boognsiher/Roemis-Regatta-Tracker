; Ein Projekt, drei Programme:
;   logger  = ESP32 + GPS auf jedem Boot, Upload per Hotspot (Start-Variante)
;   tracker = Funk-Tracker (LoRa), master = Funk-Empfaenger bei dir im Boot (spaeter, fuer Live-Karte)
;   pio run -e logger  -t upload
; Pro Tracker vorher TRACKER_ID setzen (= LoRa-Nr aus dem Admin-Bereich): entweder in include/config.h
; oder hier unter [env:tracker] mit  build_flags = ${env.build_flags} -DTRACKER_ID=7

[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
build_flags =
    ; -DBOARD_HELTEC_V3    ; <- einkommentieren, wenn Heltec WiFi LoRa 32 V3 verwendet wird

; Guenstige Variante: nur GPS + Flash-Log, Upload per Hotspot (kein LoRa). Siehe README.
[env:logger]
build_src_filter = -<*> +<logger.cpp>
board_build.filesystem = littlefs
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3

; Spaeter/optional: Live-Funk (LoRa) fuer die Live-Karte
[env:tracker]
build_src_filter = -<*> +<tracker.cpp>
board_build.filesystem = littlefs
lib_deps =
    jgromes/RadioLib@^6.6.0
    mikalhart/TinyGPSPlus@^1.0.3

[env:master]
build_src_filter = -<*> +<master.cpp>
lib_deps =
    jgromes/RadioLib@^6.6.0
    h2zero/NimBLE-Arduino@^1.4.2

; ---- LilyGO T-Beam V1.2 (ESP32 + SX1262 + GPS + 18650-Halter) ----
;   pio run -e logger_tbeam -t upload     (Hotspot-Logger, LoRa aus)
;   pio run -e tracker_tbeam -t upload    (LoRa-Tracker)
;   pio run -e master_tbeam -t upload     (LoRa-Master)
[env:logger_tbeam]
extends = env:logger
board = ttgo-t-beam
build_flags = ${env.build_flags} -DBOARD_TBEAM_V12
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    lewisxhe/XPowersLib@^0.2.6

[env:tracker_tbeam]
extends = env:tracker
board = ttgo-t-beam
build_flags = ${env.build_flags} -DBOARD_TBEAM_V12
lib_deps =
    jgromes/RadioLib@^6.6.0
    mikalhart/TinyGPSPlus@^1.0.3
    lewisxhe/XPowersLib@^0.2.6

[env:master_tbeam]
extends = env:master
board = ttgo-t-beam
build_flags = ${env.build_flags} -DBOARD_TBEAM_V12
lib_deps =
    jgromes/RadioLib@^6.6.0
    h2zero/NimBLE-Arduino@^1.4.2
    lewisxhe/XPowersLib@^0.2.6
