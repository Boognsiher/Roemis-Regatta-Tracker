; Drei Programme:
;   logger  = ESP32 + GPS auf jedem Boot, Flash-Log + Upload per Hotspot (guenstigste Variante, kein LoRa)
;   tracker = LoRa-Funk-Tracker (Live-Karte) + dasselbe Flash-Log/Hotspot-Upload wie der Logger
;   master  = LoRa-Empfaenger bei dir im Boot (BLE zum Handy)
; Je Board eine Umgebung:  <programm>            = ESP32-S3-DevKit / Heltec V3 (mit -DBOARD_HELTEC_V3)
;                          <programm>_tbeam      = LilyGO T-Beam V1.2
;   pio run -e logger_tbeam  -t upload
;
; Pro Geraet in include/secrets.h (Kopie von secrets.h.example): TRACKER_ID, SERVER_ID, TRACKER_TOKEN, WLAN, Server.
; Optionales OLED-Display: in der jeweiligen Umgebung unter build_flags  -DUSE_OLED  ergaenzen (siehe README).

[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
build_flags =
    ; -DBOARD_HELTEC_V3    ; <- einkommentieren, wenn Heltec WiFi LoRa 32 V3 verwendet wird
    ; -DUSE_OLED           ; <- einkommentieren, wenn ein SSD1306-OLED angeschlossen ist

[env:logger]
build_src_filter = -<*> +<logger.cpp>
board_build.filesystem = littlefs
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    olikraus/U8g2@^2.35.19

[env:tracker]
build_src_filter = -<*> +<tracker.cpp>
board_build.filesystem = littlefs
lib_deps =
    jgromes/RadioLib@^6.6.0
    mikalhart/TinyGPSPlus@^1.0.3
    olikraus/U8g2@^2.35.19

[env:master]
build_src_filter = -<*> +<master.cpp>
lib_deps =
    jgromes/RadioLib@^6.6.0
    h2zero/NimBLE-Arduino@^1.4.2
    olikraus/U8g2@^2.35.19

; ---- LilyGO T-Beam V1.2 (ESP32 + SX1262 + GPS + 18650-Halter) ----
[env:logger_tbeam]
extends = env:logger
board = ttgo-t-beam
build_flags =
    -DBOARD_TBEAM_V12
    ; -DUSE_OLED
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    olikraus/U8g2@^2.35.19
    lewisxhe/XPowersLib@^0.2.6

; LoRa-Tracker ohne Hotspot-Upload (kein WLAN, kein secrets.h noetig). TRACKER_ID = LoRa-Nr aus dem Admin, hier setzen:
[env:tracker_tbeam]
extends = env:tracker
board = ttgo-t-beam
build_flags =
    -DBOARD_TBEAM_V12
    -DHOTSPOT_UPLOAD=0
    -DTRACKER_ID=2
    ; -DUSE_OLED
lib_deps =
    jgromes/RadioLib@^6.6.0
    mikalhart/TinyGPSPlus@^1.0.3
    olikraus/U8g2@^2.35.19
    lewisxhe/XPowersLib@^0.2.6

[env:master_tbeam]
extends = env:master
board = ttgo-t-beam
build_flags =
    -DBOARD_TBEAM_V12
    ; -DUSE_OLED
lib_deps =
    jgromes/RadioLib@^6.6.0
    h2zero/NimBLE-Arduino@^1.4.2
    olikraus/U8g2@^2.35.19
    lewisxhe/XPowersLib@^0.2.6

; Dein eigenes Boot: Master + Tracker in einem Geraet (empfaengt die anderen per LoRa, eigene Position per GPS, alles per
; Bluetooth ans Handy). OWN_TRACKER_ID = LoRa-Nr deines Boots aus dem Admin.
[env:boatmaster_tbeam]
extends = env:master
board = ttgo-t-beam
build_flags =
    -DBOARD_TBEAM_V12
    -DOWN_TRACKER_ID=1
    ; -DUSE_OLED
lib_deps =
    jgromes/RadioLib@^6.6.0
    h2zero/NimBLE-Arduino@^1.4.2
    mikalhart/TinyGPSPlus@^1.0.3
    olikraus/U8g2@^2.35.19
    lewisxhe/XPowersLib@^0.2.6
