<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roemis Regatta Tracker - Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>🏁 Regatta Live-Tracker</h1>
      <span><a class="admin-link" href="live.html">Live-Rangliste</a> <a class="admin-link" href="results.html">Ergebnisse</a> <a class="admin-link" href="regatta.html">Wettfahrtleitung</a> <a class="admin-link" href="admin.html">Admin</a> <a class="admin-link" href="app.html">Android-App</a> <button id="logout-btn" class="admin-link" style="display:none;background:none;cursor:pointer">Abmelden</button></span>
    </header>
    <div class="layout">
      <aside id="sidebar" class="collapsed">
        <button id="sidebar-toggle" type="button" aria-expanded="false"><span id="sidebar-summary">Boote</span><span id="sidebar-arrow">&#9650;</span></button>
        <div id="track-controls" class="hint" style="margin-bottom:0.6rem">
          <label style="display:block;margin-bottom:0.3rem" title="Start-/Ziellinie, Bojen und Tore des aktiven Kurses."><input type="checkbox" id="show-course" checked /> Wettfahrtkurs anzeigen</label>
          <div id="course-status" class="hint" style="margin-bottom:0.3rem"></div>
          <button type="button" id="zoom-course" class="secondary" style="margin-bottom:0.4rem">Zum Kurs zoomen</button>
          <label style="display:block;margin-bottom:0.3rem"><input type="checkbox" id="full-track" /> Ganze Spur anzeigen</label>
          <label style="display:block;margin-bottom:0.3rem" title="Nur die Darstellung: rundet Zickzack und entfernt GPS-Zittern im Stand. Zeitnahme und Daten bleiben unveraendert."><input type="checkbox" id="smooth-track" checked /> Spur glaetten</label>
          <select id="track-range" style="width:100%">
            <option value="segment">letzte Fahrt (Pause &gt; 30 min)</option>
            <option value="hours">letzte 24 Stunden</option>
            <option value="all">alles</option>
          </select>
          <div id="track-info" style="margin-top:0.3rem"></div>
        </div>
        <div id="boat-list"></div>
        <p class="hint">Keine Boote? Im <a href="admin.html">Admin-Bereich</a> einen Tracker anlegen und den
        Link/QR-Code an den Skipper schicken.</p>
      </aside>
      <main id="map"></main>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/logout.js"></script>
</body>
</html>
