<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Regatta Tracker - Admin</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="admin-wrap">
    <p><a href="index.html" style="color:var(--muted)">← zurueck zur Live-Karte</a></p>
    <h1>Admin</h1>
    <p><a href="regatta.html" style="color:var(--accent)">→ Wettfahrtleitung (Yardstick, Linie, Wettfahrten)</a> · <a href="gateway.html" style="color:var(--accent)">→ Gateway (LoRa-Master)</a></p>

    <div id="login-card" class="card">
      <div class="field">
        <label for="admin-token">Admin-Token</label>
        <input type="password" id="admin-token" placeholder="Admin-Token eingeben" />
      </div>
      <button id="login-btn">Anmelden</button>
      <p id="login-error" class="error-msg" style="display:none"></p>
    </div>

    <div id="main-card" style="display:none">
      <div class="card">
        <h2 style="margin-top:0">Neuen Tracker anlegen</h2>
        <p class="hint">Jeder Tracker bekommt automatisch eine LoRa-Nr (= TRACKER_ID in der Firmware des Funk-Trackers).</p>
        <div class="field">
          <label for="new-name">Name (z.B. Bootsname / Segelnummer)</label>
          <input type="text" id="new-name" placeholder="z.B. Regatta-Boot 1" />
        </div>
        <button id="create-btn">Tracker anlegen</button>
        <p id="create-error" class="error-msg" style="display:none"></p>
      </div>

      <div class="card">
        <h2 style="margin-top:0">Bestehende Tracker</h2>
        <div id="tracker-list"></div>
      </div>
    </div>
  </div>

<script src="js/admin.js"></script>
</body>
</html>
